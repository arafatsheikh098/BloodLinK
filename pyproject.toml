[project]
name = "bloodlink"
version = "0.1.0"
description = "Privacy-first blood-donor coordination tool for a volunteer club."
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "sqlmodel==0.0.22",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "jinja2==3.1.4",
    "python-multipart==0.0.20",
    "argon2-cffi==23.1.0",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-playwright==0.7.0",
    "freezegun==1.5.1",
    "hypothesis==6.128.2",
    "ruff==0.8.3",
    "anyio==4.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E501: line length handled by formatter
# UP042: we use (str, Enum) deliberately so values serialize as plain
#        strings and remain forward-compatible with older Python tooling.
ignore = ["E501", "UP042"]