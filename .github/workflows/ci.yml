name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bloodlink
          POSTGRES_USER: bloodlink
          POSTGRES_PASSWORD: bloodlink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bloodlink -d bloodlink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://bloodlink:bloodlink@localhost:5432/bloodlink
      SECRET_KEY: test-secret-key-not-for-production-use-only-ci
      ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "fastapi==0.115.6" \
            "uvicorn[standard]==0.32.1" \
            "sqlmodel==0.0.22" \
            "alembic==1.14.0" \
            "psycopg[binary]==3.2.3" \
            "pydantic==2.10.3" \
            "pydantic-settings==2.6.1" \
            "jinja2==3.1.4" \
            "python-multipart==0.0.20" \
            "argon2-cffi==23.1.0" \
            "httpx==0.28.1" \
            "itsdangerous==2.2.0"
          pip install \
            "pytest==8.3.4" \
            "freezegun==1.5.1" \
            "hypothesis==6.128.2" \
            "ruff==0.8.3" \
            "anyio==4.7.0"
          pip install -e .
      - name: Lint
        run: ruff check app tests
      - name: Test (SQLite default + Postgres)
        run: |
          DATABASE_URL="" pytest -q
          DATABASE_URL=$DATABASE_URL SECRET_KEY=$SECRET_KEY pytest -q
