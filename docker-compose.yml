services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bloodlink
      POSTGRES_USER: bloodlink
      POSTGRES_PASSWORD: bloodlink
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodlink -d bloodlink"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: development
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-this-is-not-a-real-secret-do-not-use}
      DATABASE_URL: postgresql+psycopg://bloodlink:bloodlink@db:5432/bloodlink
      DEMO_MODE: "true"
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  pgdata: